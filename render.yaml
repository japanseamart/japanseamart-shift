services:
  - type: web
    name: japanseamart-shift
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    disk:
      name: shift-data
      mountPath: /app
      sizeGB: 1
